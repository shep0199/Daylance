<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daylance | Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Accessibility: Skip navigation to main content -->
<a href="#main-content" class="skip-link">
  Skip to main content
</a>

 <!-- Wrapper: holds all page content -->
     <div class="wrapper">

 <!-- Header: Daylance branding and website navigation -->
    
        <header class="site-header">
            <h1>Daylance</h1>
    
<!-- Main navigation: one link for each page in the site map -->
     <nav aria-label="Main">
        <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="calendar.html" aria-current="page">Calendar</a></li>
                <li><a href="messages.html">Messages</a></li>
                <li><a href="income.html">Income</a></li>
                <li><a href="content.html">Content</a></li>
            </ul>
        </nav>
    </header>

<!-- Main: Calendar page content -->
 <main id="main-content" tabindex="-1">

    <!-- Intro -->
    <section id="calendar-intro">
        <h2>Calendar</h2>
        <p>Add your shoots, edits, meetings, and deadlines so your whole week is in one place.</p>
    </section>

<!-- Form: freelancer adds an event to their calendar -->
<section id="add-event">
    <h2>Add an Event</h2>

<!--I used post because the form creates new data (a calendar event) and includes private details like client names and notes. get would put all of that in the URL, where it’s visible, saved in history, and could be resubmitted by accident. get is only for forms that retrieve data, like search-->

    <form action="result.html" method="post">
         <div>
             <label for="event-name">Event Name</label>
             <input type="text" id="event-name" name="eventname" placeholder="Event Name" required>
         </div>

         <div>
             <label for="event-date">Date</label>
             <input type="date" id="event-date" name="eventdate" required>
        </div>
        
        <div>
            <label for="event-time">Time</label>
            <input type="time" id="event-time" name="eventtime">
        </div>

        <div>
             <label for="client">Client</label>
             <input type="text" id="client" name="client" placeholder="Client Name">
        </div>
        
        <div>
             <label for="type">Event Type</label>
             <select name="eventtype" id="type">
                 <option value="shoot">Shoot</option>
                 <option value="edit">Editing</option>
                 <option value="meeting">Meeting or Call</option>
                 <option value="deadline">Deadline</option>
                 <option value="admin">Admin</option>
    </select>
</div>

<div>
    <fieldset>
        <legend>Priority</legend>

        <label for="high">High</label>
        <input type="radio" id="high" name="priority" value="high">

        <label for="medium">Medium</label>
        <input type="radio" id="medium" name="priority" value="medium" checked>

        <label for="low">Low</label>
        <input type="radio" id="low" name="priority" value="low">
    </fieldset>
</div>

<div>
    <label for="notes">Notes</label>
    <textarea name="notes" id="notes" placeholder="Enter any notes here..."></textarea>
</div>
<div>
    <button type="submit">Add to Calendar</button>
</div>

    </form>
</section>
</main>


</div>

</body>
</html>
